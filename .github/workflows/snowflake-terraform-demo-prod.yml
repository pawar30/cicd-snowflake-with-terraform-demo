name: "PRODUCTION ENV: Snowflake Terraform Demo Workflow"

# PR into main  -> plan only (posted as a PR comment)
# merge to main -> apply
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write      # lets the job ask GitHub for its OIDC token (Entra + Azure Storage)
  contents: read
  pull-requests: write # lets the job comment the plan on the PR

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_DIR: ./prod
  # Azure / Entra: identifiers only, no secrets
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true" # state backend logs in to Azure Storage with the job's GitHub OIDC token
  # Snowflake connection (the token itself is added at runtime)
  SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
  SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }} # LOGIN_NAME of TF_DEPLOY_SVC = Entra object ID

jobs:
  deploy-terraform-prod:
    name: "Plan (PR) / Apply (main) on Prod"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Entra (federated credential, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Snowflake access token from Entra
        run: |
          TOKEN=$(az account get-access-token --scope "api://${{ vars.SF_RESOURCE_APP_ID }}/.default" --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        id: init
        run: terraform -chdir=$TF_DIR init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"

      - name: Terraform Format
        id: fmt
        run: terraform -chdir=$TF_DIR fmt -recursive -check

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=$TF_DIR validate -no-color

      - name: Terraform Plan on Prod for PR
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform -chdir=$TF_DIR plan -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=$TF_DIR apply -auto-approve -input=false
